services:
  # Spring Boot API Backend Service
  - type: web
    name: ems-backend-api
    runtime: docker
    rootDir: employee-management-api
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: ems-postgres-db
          property: connectionString
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: APP_DATA_SEED_ON_STARTUP
        value: "true"

databases:
  # PostgreSQL Cloud Database
  - name: ems-postgres-db
    databaseName: employee_management
    user: ems_user
    plan: free
