# ============================================================
# Neon Cloud PostgreSQL Profile
# ============================================================

server.port=${PORT:8085}
server.servlet.context-path=/api/v1
server.error.include-message=always
server.error.include-stacktrace=never

# Database — Neon Serverless PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-young-glitter-aps6eefy-pooler.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_wK1Ivjou5LBh}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool optimized for Neon Serverless
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=EMS-Neon-HikariCP

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# JWT
app.jwt.secret=c2VjdXJlLXNlY3JldC1rZXktZm9yLWVtcGxveWVlLW1hbmFnZW1lbnQtc3lzdGVtLTIwMjYtcHJvZHVjdGlvbi1ncmFkZQ==
app.jwt.access-token-expiration=86400000
app.jwt.refresh-token-expiration=604800000
app.jwt.issuer=employee-management-system

# CORS
app.cors.allowed-origins=*

# Seed Data
app.data.seed-on-startup=true
