# ============================================================
# Neon Cloud PostgreSQL Profile
# ============================================================

server.port=${PORT:8080}
server.servlet.context-path=
server.error.include-message=always
server.error.include-stacktrace=never

# Database — Neon Serverless PostgreSQL
spring.datasource.url=${NEON_DB_URL:jdbc:postgresql://localhost:5432/employee_management}
spring.datasource.username=${NEON_DB_USER:postgres}
spring.datasource.password=${NEON_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool optimized for Neon Serverless
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=EMS-Neon-HikariCP

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# JWT
app.jwt.secret=c2VjdXJlLXNlY3JldC1rZXktZm9yLWVtcGxveWVlLW1hbmFnZW1lbnQtc3lzdGVtLTIwMjYtcHJvZHVjdGlvbi1ncmFkZQ==
app.jwt.access-token-expiration=86400000
app.jwt.refresh-token-expiration=604800000
app.jwt.issuer=employee-management-system

# CORS
app.cors.allowed-origins=*

# Seed
app.data.seed-on-startup=true
