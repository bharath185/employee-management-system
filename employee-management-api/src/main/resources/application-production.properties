# ============================================================
# Production Windows Single-Port Profile (Local / Standalone)
# ============================================================

server.port=${PORT:8085}
server.servlet.context-path=
server.error.include-message=always
server.error.include-stacktrace=never

# Database — Local Embedded PostgreSQL 17
spring.datasource.url=jdbc:postgresql://localhost:5432/employee_management
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=EMS-Production-HikariCP

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.defer-datasource-initialization=true

# JWT
app.jwt.secret=c2VjdXJlLXNlY3JldC1rZXktZm9yLWVtcGxveWVlLW1hbmFnZW1lbnQtc3lzdGVtLTIwMjYtcHJvZHVjdGlvbi1ncmFkZQ==
app.jwt.access-token-expiration=86400000
app.jwt.refresh-token-expiration=604800000
app.jwt.issuer=employee-management-system

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
app.bill.upload-dir=data/uploads/bills
app.photo.upload-dir=data/uploads/photos
app.document.upload-dir=data/uploads/documents
app.company.upload-dir=data/uploads/company

# CORS
app.cors.allowed-origins=*

# Base URL
app.base-url=http://localhost:8085

# Logging
logging.level.com.ems=INFO
logging.level.org.springframework.security=WARN
logging.file.name=logs/ems.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
